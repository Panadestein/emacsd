name: Publish

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Install Emacs
        run: |
          sudo apt-get update
          sudo apt-get install --yes emacs-nox

      - name: Build the site
        run: ./publi.sh

      - name: Publish generated content to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: public
